# kritic configuration.
#
# Location: $KRITIC_CONFIG, else $KRITIC_HOME/kritic.toml (KRITIC_HOME defaults to ~/.kritic).
# Precedence: environment variable > this file > built-in default. Every key below is shown
# commented out with its default; uncomment only what you change. Unknown keys are reported by
# the `status` tool (config_errors) and ignored.
#
# Kev thresholds are deliberately NOT configurable: they are calibrated gates stored with their
# evidence in specs/*.json. Recalibrate (scripts/calibrate-specs.mjs) instead of editing them.

[kev]
# Who answers Kev's typed questions:
#   auto  - local Kev when installed (laya + GGUF), else cloud Jev when a gateway key is configured
#   local - local Kev only (nothing leaves the machine)
#   cloud - cloud Jev only (code excerpts are sent to the AI Gateway)
#   off   - no model: deterministic tools only; Kev-backed verdicts report null
# backend = "auto"                              # KRITIC_KEV_BACKEND
# cpu_only = false                             # KRITIC_KEV_CPU_ONLY: true only for a CPU Kev service
# externally_managed = false                  # KRITIC_KEV_EXTERNALLY_MANAGED: never spawn or stop laya; supervisor owns recovery
# gpu_uuid = ""                               # KRITIC_KEV_GPU_UUID: full GPU UUID; requires distinct vision.gpu_uuid
# device = "auto"                             # KRITIC_LAYA_DEVICE: auto, cpu, cuda:0 or vulkan:0
# max_batch = 4                               # KRITIC_LAYA_MAX_BATCH: optional positive override; unset uses laya default
# vulkan_visible_devices = ""                 # KRITIC_VULKAN_VISIBLE_DEVICES: verified Vulkan ordinal (not CUDA ordinal)
# Dedicated pair: explicit cuda:0 or vulkan:0 keeps both models resident and uses separate
# leases. CUDA visibility uses the Kev UUID; Vulkan uses GGML_VK_VISIBLE_DEVICES instead.
# Select an executable compiled for the chosen backend/card. Vulkan skips --cuda-graph.
# Laya health validates the backend, but cannot prove the physical UUID: verify its PID with
# nvidia-smi after deployment. GPU UUIDs do not translate automatically to Vulkan ordinals.
# CPU-only launches use --device cpu. Kev calls bypass GPU leases and never stop the shared
# service or evict vision. Existing/external services must already run on CPU; restart them
# explicitly before changing this flag. Vision tools still hold the GPU lease.
#
# Kev-4B typed-decision model, served by laya. kritic starts laya itself when it is not running.
# laya_url = "http://127.0.0.1:8089"            # KRITIC_LAYA_URL (default built from laya_port)
# A second Kev on the vision GPU, used for every Kev call while the vision GPU is idle (Ollama
# /api/ps lists no model, or a GPU router's /v1/lanes shows that GPU's lane idle). It is stopped
# before vision work, when the lane gets busy, and after vision_gpu_idle_s without use.
# Unset: always laya_url.
# vision_gpu_laya_url = "http://127.0.0.1:8090" # KRITIC_VISION_GPU_KEV_URL
# vision_gpu_start = ""                         # KRITIC_VISION_GPU_KEV_START: command that launches it detached
# vision_gpu_stop = ""                          # KRITIC_VISION_GPU_KEV_STOP: command that stops it
# vision_gpu_uuid = ""                          # KRITIC_VISION_GPU_KEV_UUID: its GPU; only that router lane counts
# vision_gpu_idle_s = 120                       # KRITIC_VISION_GPU_KEV_IDLE_S: stop it after this long unused (0: never)
# laya_port = 8089                              # KRITIC_LAYA_PORT
# laya_exe = "~/.kritic/laya/laya.exe"          # KRITIC_LAYA_EXE (default: laya on PATH, else ~/.kritic/laya/)
# gguf = "~/.kritic/models/kev_4b_q8_0.gguf"    # KRITIC_KEV_GGUF
# model = "kev-4b"                              # KRITIC_KEV_MODEL
# cuda_cache = "~/.kritic/cuda-cache"           # KRITIC_CUDA_CACHE: persisted PTX JIT (skips a ~40 s compile on restart)
# chunk_chars = 1300                            # KRITIC_CHUNK_CHARS: code per Kev request (context is 2,048 tokens)
# token_budget = 2900                           # KRITIC_TOKEN_BUDGET: rows x tokens per laya batch (latency cliff above ~3.7k)
# max_seq_tokens = 2048                         # KRITIC_MAX_SEQ_TOKENS
# request_s = 60                                # KRITIC_KEV_REQUEST_S: one request; a stall stops laya so the next call restarts it
# critic_deadline_s = 600                       # KRITIC_CRITIC_DEADLINE_S: a whole critic pass returns what it has after this

[cloud]
# Cloud Jev, TypeSafe AI's typed-evaluation model, through Vercel's AI Gateway. Used when
# kev.backend is "cloud", or "auto" without a local Kev. The key comes from AI_GATEWAY_API_KEY,
# else from key_file (written by `kritic setup`); it is never stored here. Kev's calibrated
# gates are advisory under Jev until you run `kritic calibrate` with the cloud backend.
# url = "https://ai-gateway.vercel.sh/v1/evaluate"   # KRITIC_CLOUD_URL
# model = "typesafe-ai/jev"                     # KRITIC_CLOUD_MODEL
# key_env = "AI_GATEWAY_API_KEY"                # KRITIC_CLOUD_KEY_ENV; direct TypeSafe: TYPESAFE_API_KEY
# key_file = "~/.kritic/ai-gateway.key"         # KRITIC_CLOUD_KEY_FILE

[vision]
# gpu_uuid = ""                               # KRITIC_VISION_GPU_UUID: full UUID distinct from Kev's
# externally_managed = false                  # KRITIC_OLLAMA_EXTERNALLY_MANAGED
# Dedicated GPU pairs always require an externally started Ollama service. Pin that service
# with CUDA_VISIBLE_DEVICES=<vision UUID> and OLLAMA_HOST=<configured ollama_url>.
# Kritic cannot inspect a running Ollama server's device visibility; verify its PID placement.
# Qwen2.5-VL through Ollama: visual_critic scores and the ux_critic novice.
# ollama_url = "http://127.0.0.1:11434"         # KRITIC_OLLAMA_URL
# ollama_exe = "ollama"                         # KRITIC_OLLAMA_EXE (default: ollama on PATH, else the platform install path)
# model = "qwen2.5vl:7b"                        # KRITIC_VISION_MODEL
# visual_min = 6.0                              # KRITIC_VISUAL_MIN: lowest per-criterion score (0-10) that still approves

[review]
# max_revisions = 2                             # KRITIC_MAX_REVISIONS: revise-and-rescore rounds the agent may take
# command_timeout_s = 300                       # KRITIC_COMMAND_TIMEOUT: each artifact_validate command
# context_limit = 1000000                       # KRITIC_CONTEXT_LIMIT: model context size token_metrics measures against

[ui]
# Web testing (ui_test, visual_critic screenshots, ux_critic on web apps) drives Chrome or Edge
# directly over the DevTools protocol; no Node or Playwright needed.
# browser = ""                                  # KRITIC_BROWSER (default: installed Chrome/Chromium/Edge, else the Chrome for Testing `kritic setup` downloads)
# timeout_s = 300                               # KRITIC_UI_TIMEOUT

[output]
# How your agent writes its replies. "concise": `kritic register` installs the kritic-concise
# output style (Claude Code), a short reply rule in CLAUDE.md, and the same rule for Hermes.
# "default": leave the agent's style alone. Measure the effect with token_metrics (output tokens per task).
# style = "concise"                             # KRITIC_OUTPUT_STYLE

[scan]
# security_critic / code_quality_critic. Each tool is looked up in tools_bin, then on PATH.
# A missing tool is reported as failed and approval becomes null; nothing is assumed clean.
# tools_bin = "~/.kritic/bin"                   # KRITIC_TOOLS_BIN: gitleaks, osv-scanner, semgrep, bandit, ruff
# cargo_tools_bin = "~/.cargo/bin"              # KRITIC_CARGO_TOOLS_BIN: cargo-audit
# timeout_s = 600                               # KRITIC_SCAN_TIMEOUT
# semgrep_config = "p/default"                  # KRITIC_SEMGREP_CONFIG
# max_triage = 25                               # KRITIC_MAX_TRIAGE: findings Kev ranks (ordering only)
# max_hotspots = 10                             # KRITIC_MAX_HOTSPOTS: complex functions Kev rates for maintainability

[desktop]
# Python harness (uv): desktop_test, resource_critic, hygiene_critic, ux_critic on desktop/Unity apps.
# uv = "uv"                                     # KRITIC_UV
# harness_py = "<install>/harness/py"           # KRITIC_HARNESS_PY

[unity]
# editor = ""                                   # KRITIC_UNITY_EDITOR: force one Unity.exe for unity_tests
# hub_editors = "C:/Program Files/Unity/Hub/Editor"   # KRITIC_UNITY_HUB_EDITORS: <version>/Editor/Unity.exe is used

[server]
# ws_port = 8790                                # KRITIC_WS_PORT: live event stream (a free port is used if taken; status() reports it)
# gpu_wait_s = 900                              # KRITIC_GPU_WAIT: wait for another session's model before running anyway
# log = "~/.kritic/logs/calls.jsonl"            # KRITIC_LOG: audit log; model_usage.jsonl and laya.log sit beside it
# runs_dir = "~/.kritic/runs"                   # KRITIC_RUNS_DIR: screenshots and full results (full_result paths)

[tools]
# MCP tools not offered to the client. map_eval is the Beat Saber domain pack; set
# disabled = [] to enable it. Disable anything you never use to shrink the tool list the
# agent loads into its context.
# disabled = ["map_eval"]                       # KRITIC_DISABLED_TOOLS (comma-separated)
