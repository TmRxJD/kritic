[package]
name = "kritic"
version = "0.4.0"
edition = "2024"
rust-version = "1.89"
description = "Local, advisory end-of-task review for coding agents: deterministic checkers produce findings, the Kev typed-decision model scores them, code decides."
license = "Apache-2.0"
repository = "https://github.com/TmRxJD/kritic"
readme = "README.md"
keywords = ["mcp", "code-review", "agents", "llm", "testing"]
categories = ["development-tools", "command-line-utilities"]

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
chrono = "0.4.45"
futures-util = "0.3.34"
regex = "1.13.1"
reqwest = { version = "0.13.5", features = ["json"] }
rmcp = { version = "3.4.1", features = ["server", "transport-io", "macros", "schemars"] }
schemars = "=1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml = "0.9.34"
tokio = { version = "1.53.1", features = ["full"] }
tokio-tungstenite = "0.30.0"
toml = "1.1.6"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
opt-level = 3
lto = "thin"
