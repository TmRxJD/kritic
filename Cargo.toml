[package]
name = "kritic"
version = "0.5.0-test.2"
edition = "2024"
rust-version = "1.89"
description = "Experimental evidence-based review for coding agents: deterministic checks, work contracts, optional cloud/local reviewers."
license = "Apache-2.0"
repository = "https://github.com/TmRxJD/kritic"
readme = "README.md"
keywords = ["mcp", "code-review", "agents", "llm", "testing"]
categories = ["development-tools", "command-line-utilities"]

[dependencies]
tempfile = "3.27.0"
anyhow = "1.0.104"
base64 = "0.23.1"
chromiumoxide = "0.9.1"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
flate2 = "1.1.10"
futures-util = "0.3.34"
netstat2 = "0.11.2"
regex = "1.13.1"
reqwest = { version = "0.13.5", features = ["json", "stream"] }
rmcp = { version = "3.4.1", features = ["server", "transport-io", "macros", "schemars"] }
rpassword = "7.5.4"
schemars = "=1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
serde_yaml = "0.9.34"
sha2 = "0.11.0"
sysinfo = "0.38.4"
tar = "0.4.46"
tokio = { version = "1.53.1", features = ["full"] }
tokio-tungstenite = "0.30.0"
toml = "1.1.6"
toml_edit = "0.25.15"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[dev-dependencies]

[profile.release]
opt-level = 3
lto = "thin"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_ProcessStatus", "Win32_System_Diagnostics_ToolHelp"] }
