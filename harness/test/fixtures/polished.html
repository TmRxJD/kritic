<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Account settings</title>
  <style>
    :root { --fg: #1a1a1a; --muted: #555; --line: #e3e3e3; --accent: #1f5fbf; }
    * { box-sizing: border-box; }
    body { margin: 0; font: 16px/1.5 system-ui, sans-serif; color: var(--fg); background: #f6f7f9; }
    header { background: #fff; border-bottom: 1px solid var(--line); padding: 16px 32px; }
    header h1 { margin: 0; font-size: 20px; }
    main { max-width: 720px; margin: 32px auto; padding: 0 16px; display: grid; gap: 24px; }
    .card { background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 24px; }
    .card h2 { margin: 0 0 4px; font-size: 18px; }
    .card p { margin: 0 0 16px; color: var(--muted); }
    label { display: block; font-weight: 600; margin: 16px 0 6px; }
    input, select { width: 100%; padding: 10px 12px; border: 1px solid #bbb; border-radius: 6px; font: inherit; }
    .row { display: flex; justify-content: flex-end; gap: 12px; margin-top: 24px; }
    button { padding: 10px 18px; border-radius: 6px; font: inherit; border: 1px solid #bbb; background: #fff; }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  </style>
</head>
<body>
  <header><h1>Account settings</h1></header>
  <main>
    <section class="card">
      <h2>Profile</h2>
      <p>This information appears on your public page.</p>
      <label for="n">Display name</label><input id="n" value="Ada Lovelace">
      <label for="e">Email</label><input id="e" type="email" value="ada@example.test">
      <div class="row"><button>Cancel</button><button class="primary">Save changes</button></div>
    </section>
    <section class="card">
      <h2>Preferences</h2>
      <p>Choose how the app looks and notifies you.</p>
      <label for="t">Theme</label><select id="t"><option>System</option><option>Light</option><option>Dark</option></select>
      <label for="l">Language</label><select id="l"><option>English</option><option>Français</option></select>
    </section>
  </main>
</body>
</html>
