<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>settings</title>
  <style>
    body { margin: 0; font-family: "Comic Sans MS", cursive; background: #ff00aa; }
    .a { position: absolute; top: 20px; left: 30px; font-size: 44px; color: #ffff00; }
    .b { position: absolute; top: 40px; left: 60px; font-size: 11px; color: #ee3399; background: #ff22bb; width: 300px; }
    .c { position: absolute; top: 140px; left: 5px; width: 900px; }
    .c input { margin-left: 173px; width: 60px; font-size: 8px; }
    .c input.x { margin-left: 11px; width: 500px; font-size: 22px; }
    .d { position: absolute; top: 120px; left: 400px; background: lime; color: #99ff99; padding: 1px 40px 30px 3px; border: 5px dashed red; }
    .e { position: absolute; top: 210px; left: 250px; transform: rotate(-7deg); font-size: 9px; color: #fe20a8; }
    button { font-size: 7px; }
    .f { position: absolute; top: 180px; left: 200px; background: #00ffff; color: #11eeee; padding: 30px; }
  </style>
</head>
<body>
  <div class="a">SETTINGS!!!</div>
  <div class="b">Change your profile information and other stuff here please read carefully before saving anything important</div>
  <div class="c">Name<input> Email<input class="x"> Theme<select><option>a</option></select></div>
  <div class="d">SAVE<button>ok</button><button>cancel</button><button>save?</button></div>
  <div class="e">language: english english english</div>
  <div class="f">Notifications: on off maybe</div>
</body>
</html>
