# Explicit default policy for staged scope checks; no source exclusions or baselines.
version = 1

[commit]
level = "focused"
require_scope_plan = true

[organization]
max_file_lines = 500
hard_file_lines = 1000
max_folder_files = 40
max_depth = 8
long_function_lines = 60
complex_function_branches = 8
