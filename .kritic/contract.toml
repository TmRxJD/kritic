version = 1
title = "Kritic test-release acceptance assertions"
sources = ["README.md", "CONTRIBUTING.md", "docs/testing-release.md"]

[[requirements]]
id = "offline-regressions"
description = "Offline regression suites execute successfully, including providers, contracts, vacuity and model-free defaults"
require_enforcement = true
[[requirements.checks]]
kind = "command"
command = "cargo test --all-targets"
[[requirements.enforcement]]
path = ".github/workflows/ci.yml"
pattern = "cargo test --all-targets"

[[requirements]]
id = "lint-and-format"
description = "All Rust targets pass clippy and formatting checks"
require_enforcement = true
[[requirements.checks]]
kind = "command"
command = "cargo fmt --all -- --check"
[[requirements.checks]]
kind = "command"
command = "cargo clippy --all-targets -- -D warnings"
[[requirements.enforcement]]
path = ".github/workflows/ci.yml"
pattern = "cargo clippy --all-targets -- -D warnings"

[[requirements]]
id = "test-release-mandate"
description = "The shipped skill header declares test release, independent validation and direct Kritic fix/PR duties"
[[requirements.checks]]
kind = "content"
path = "examples/claude/skills/kritic/SKILL.md"
pattern = "TEST RELEASE"
[[requirements.checks]]
kind = "content"
path = "examples/claude/skills/kritic/SKILL.md"
pattern = "fix Kritic directly"
[[requirements.checks]]
kind = "content"
path = "examples/claude/skills/kritic/SKILL.md"
pattern = "open a focused PR"

[[requirements]]
id = "integration-regressions"
description = "Hermes and calibration-policy regressions pass without inference"
[[requirements.checks]]
kind = "command"
command = "python -m pytest integrations/hermes/tests"
[[requirements.checks]]
kind = "command"
command = "python scripts/test_calibration_policy.py"
