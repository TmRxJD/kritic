name: package test release
on:
  push:
    tags: ['v*-test.*']
  workflow_dispatch:
    inputs:
      smoke_only:
        description: Test a CI binary on CPU without rebuilding release binaries
        type: boolean
        default: false
      ci_run_id:
        description: Source CI run containing kritic-windows-test (smoke_only)
        type: string
        default: ''
permissions:
  contents: read
jobs:
  package:
    if: github.event_name != 'workflow_dispatch' || !inputs.smoke_only
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-on-failure: true
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --all-targets
      - run: cargo build --workspace --release --bins --locked
      - name: Verify CPU-only prompt inference before packaging
        shell: pwsh
        run: ./scripts/smoke-prompt-release.ps1 -Kritic target/release/kritic.exe
      - name: Retain CPU prompt evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: prompt-cpu-evidence
          path: ${{ runner.temp }}/kritic-prompt-live/evidence.json
          if-no-files-found: warn
      - name: Package binary, skill, config and optional desktop harness
        shell: pwsh
        run: ./scripts/package-test-release.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kritic-windows-x86_64-test
          path: kritic-windows-x86_64-test.zip
  mac-cli:
    if: github.event_name != 'workflow_dispatch' || !inputs.smoke_only
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          components: clippy, rustfmt
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - run: test "$(uname -m)" = arm64
      - run: cargo fmt --all -- --check
      - run: cargo clippy -p kev-filter -p kev-tools --all-targets --locked -- -D warnings
      - run: cargo test -p kev-filter -p kev-tools --all-targets --locked
      - run: cargo build -p kev-filter -p kev-tools --release --bins --locked --target aarch64-apple-darwin
      - run: bash scripts/package-cli-test-release.sh target/aarch64-apple-darwin/release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kritic-cli-macos-arm64-test
          path: kritic-cli-macos-arm64-test.tar.gz
# Packaging only: publishing a GitHub release/tag requires a separate maintainer action.
  prompt-smoke:
    if: github.event_name == 'workflow_dispatch' && inputs.smoke_only
    runs-on: windows-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Download and verify the selected CI binary
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUN_ID: ${{ inputs.ci_run_id }}
        run: ./scripts/fetch-ci-prompt-candidate.ps1
      - name: Live CPU provider smoke
        shell: pwsh
        run: ./scripts/smoke-prompt-release.ps1 -UseCiCandidate
      - name: Retain CPU prompt evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: prompt-cpu-evidence
          path: ${{ runner.temp }}/kritic-prompt-live/*.json
          if-no-files-found: warn
