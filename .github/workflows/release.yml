name: package test release
on:
  push:
    tags: ['v*-test.*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-on-failure: true
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --all-targets
      - run: cargo build --workspace --release --bins --locked
      - name: Verify CPU-only prompt inference before packaging
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'ollama-v0.40.16-windows-amd64.zip'
          $runtime = Join-Path $env:RUNNER_TEMP 'kritic-ollama-v0.40.16'
          Invoke-WebRequest -Uri 'https://github.com/ollama/ollama/releases/download/v0.40.16/ollama-windows-amd64.zip' -OutFile $archive -TimeoutSec 300
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne '50fcf5ad54277f2fa5d173ebfc93bcb017adbc0c9ef2314daabc96ca9e6aa64e') { throw 'Ollama archive SHA256 mismatch' }
          Expand-Archive -LiteralPath $archive -DestinationPath $runtime
          $ollama = Join-Path $runtime 'ollama.exe'
          python scripts/smoke-prompt-model.py --kritic (Resolve-Path target/release/kritic.exe).Path --ollama $ollama --work-dir (Join-Path $env:RUNNER_TEMP 'kritic-prompt-live') --model 'qwen2.5:1.5b'
          if ($LASTEXITCODE -ne 0) { throw 'CPU prompt inference smoke failed' }
      - name: Retain CPU prompt evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: prompt-cpu-evidence
          path: ${{ runner.temp }}/kritic-prompt-live/evidence.json
          if-no-files-found: warn
      - name: Package binary, skill, config and optional desktop harness
        shell: pwsh
        run: ./scripts/package-test-release.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kritic-windows-x86_64-test
          path: kritic-windows-x86_64-test.zip
  mac-cli:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          components: clippy, rustfmt
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - run: test "$(uname -m)" = arm64
      - run: cargo fmt --all -- --check
      - run: cargo clippy -p kev-filter -p kev-tools --all-targets --locked -- -D warnings
      - run: cargo test -p kev-filter -p kev-tools --all-targets --locked
      - run: cargo build -p kev-filter -p kev-tools --release --bins --locked --target aarch64-apple-darwin
      - run: bash scripts/package-cli-test-release.sh target/aarch64-apple-darwin/release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kritic-cli-macos-arm64-test
          path: kritic-cli-macos-arm64-test.tar.gz
# Packaging only: publishing a GitHub release/tag requires a separate maintainer action.
