name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  security:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python -m pip install semgrep==1.178.0 bandit==1.9.4
      - name: Semgrep findings and parser coverage
        run: semgrep scan --config p/default --strict --error --json --metrics=off --timeout 30 --output "$env:RUNNER_TEMP/semgrep-report.json" .
      - name: Bandit findings and parser coverage
        run: bandit -r . -f json -q -x "*/.git/*" -o "$env:RUNNER_TEMP/bandit-report.json"
      - name: Reject empty or incomplete scan coverage
        run: python scripts/verify-security-reports.py "$env:RUNNER_TEMP/semgrep-report.json" "$env:RUNNER_TEMP/bandit-report.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: security-reports
          path: |
            ${{ runner.temp }}/semgrep-report.json
            ${{ runner.temp }}/bandit-report.json

  rust:
    # Developed and measured on Windows; the desktop harness and several offline tests use Win32.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all-targets
      - name: scripts parse
        shell: bash
        run: |
          bash -n scripts/install.sh scripts/fetch-models.sh
          for f in scripts/*.mjs bench/*.mjs harness/*.mjs; do node --check "$f"; done
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          repository: NousResearch/hermes-agent
          ref: a62979dc3601c9eae455bff5b35ba8f9bed0df30
          path: _test_deps/hermes
      - run: python -m pip install pytest
      - run: python -m pytest integrations/hermes/tests
        env:
          PYTHONPATH: ${{ github.workspace }}/_test_deps/hermes
          KRITIC_EXE: ${{ github.workspace }}/target/debug/kritic.exe
      - run: python scripts/test_calibration_policy.py

  legacy-browser:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: harness
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: harness/package-lock.json
      - run: npm ci
      - run: npx --no-install playwright install chromium
      - run: npm test
      - run: node --test ../bench/test/*.test.mjs
