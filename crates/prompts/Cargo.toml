[package]
name = "kritic-prompts"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
description = "Advisory prompt briefs with retained user authority and explicit rewrite guards"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
schemars = "=1.2.2"
regex = "1.13.1"
sha2 = "0.11.0"
tokio = { version = "1.53.1", features = ["process", "io-util", "rt-multi-thread", "macros", "time"] }
