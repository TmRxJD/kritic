[package]
name = "kev-filter"
version = "0.5.0-test.6"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
repository = "https://github.com/TmRxJD/kritic"
description = "Bounded command output filtering with complete raw logs and optional local Kev ranking"

[dependencies]
serde_json = "1"
ureq = { version = "3", default-features = false, features = ["json"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Console"] }