[package]
name = "kev-tools"
version = "0.3.0"
edition = "2024"
description = "Shared MCP server for Claude Code and Codex: Kev-ranked trim/digest (no generation model needed), tier picking, and handoff files."
license = "Apache-2.0"
repository = "https://github.com/TmRxJD/kritic"
readme = "README.md"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ureq = { version = "3", features = ["json"] }
